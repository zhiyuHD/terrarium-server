<script>
async function fetchJson(url,signal,options={}){
 const {timeoutMs=15000,...init}=options,request=new AbortController(),cancel=()=>request.abort();
 if(signal?.aborted)cancel();else signal?.addEventListener('abort',cancel,{once:true});
 const timer=setTimeout(cancel,timeoutMs);
 try{const response=await fetch(url,{...init,signal:request.signal});return {response,value:await response.json()}}
 finally{clearTimeout(timer);signal?.removeEventListener('abort',cancel)}
}
</script>
<script>
(() => {
  const key = 'terrarium.theme';
  const modes = ['system', 'dark', 'light'];
  const labels = { system: '跟随系统', dark: '深色', light: '浅色' };
  const media = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try { const saved = localStorage.getItem(key); if (modes.includes(saved)) preference = saved; } catch {}
  function apply() {
    const theme = preference === 'system' ? (media.matches ? 'dark' : 'light') : preference;
    document.documentElement.dataset.theme = theme;
    document.documentElement.dataset.themePreference = preference;
    document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101916' : '#f5f5ed';
    const button = document.getElementById('theme-toggle');
    if (button) {
      const next = modes[(modes.indexOf(preference) + 1) % modes.length];
      button.querySelector('span').textContent = labels[preference];
      button.setAttribute('aria-label', `主题：${labels[preference]}；切换为${labels[next]}`);
      button.title = `切换为${labels[next]}`;
    }
  }
  apply();
  media.addEventListener('change', () => { if (preference === 'system') apply(); });
  window.addEventListener('storage', event => {
    if (event.key === key || event.key === null) { preference = modes.includes(event.newValue) ? event.newValue : 'system'; apply(); }
  });
  document.addEventListener('DOMContentLoaded', () => {
    apply();
    document.getElementById('theme-toggle').addEventListener('click', () => {
      preference = modes[(modes.indexOf(preference) + 1) % modes.length];
      try { localStorage.setItem(key, preference); } catch {}
      apply();
    });
  });
})();
</script>

<body>
<header><div class="wrap nav"><div class="brand"><span class="mark" aria-hidden="true"></span>生态箱<span class="nav-label">OBSERVATORY</span></div><div class="nav-actions"><a href="/forum" class="theme-toggle">邻里花园</a><button type="button" class="theme-toggle" id="theme-toggle" aria-label="主题：跟随系统"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><span>跟随系统</span></button><div class="live" id="connection" data-state="loading"><span class="dot"></span><span id="connection-label">连接中</span></div></div></div></header>
<main class="wrap">
<section class="feedback" aria-label="金币榜"><button class="feedback-toggle" id="coins-toggle" type="button" aria-expanded="false" aria-controls="coins-board">商人的账簿 · 金币榜</button><div id="coins-board" hidden></div></section>
<section id="announcements" class="announcements" aria-label="服务端公告" aria-live="polite" hidden></section>
<section class="hero"><div><p class="eyebrow">CORTICO / LIVING ECOSYSTEMS</p><h1>一方天地，<br>自有<span>生机。</span></h1><p class="intro">观察植物生长、虫鱼觅食，看看每个生态箱的近况。</p></div><div class="release-art" data-version="<!-- LOGO_VERSION -->"><!-- RELEASE_LOGO --></div></section>
<section class="overview" aria-label="生态箱概览"><div class="stat"><strong id="box-count">—</strong><span id="box-count-label">地箱</span></div><div class="stat"><strong id="plant-count">—</strong><span>植物</span></div><div class="stat"><strong id="animal-count">—</strong><span id="animal-count-label">虫子</span></div></section>
<section aria-labelledby="gallery-title"><div class="section-top"><h2 class="section-title" id="gallery-title">生态箱图鉴 <small>COLLECTION</small></h2><div class="tools"><div class="tabs" role="group" aria-label="生态箱类型"><button class="tab" data-kind="land" aria-pressed="true">生态箱·地</button><button class="tab" data-kind="water" aria-pressed="false">生态箱·水</button></div><div class="search-wrap"><input class="search" id="search" type="text" maxlength="100" role="searchbox" placeholder="搜索名称或 ID" aria-label="搜索生态箱名称或 ID"><button id="clear-search" class="clear-search" aria-label="清除搜索" hidden></button></div></div></div>
<div class="filter-row"><p id="status" role="status">正在读取生态箱…</p><div id="sort"></div></div>
<div class="error-banner" id="error" role="alert" hidden><span></span><button id="retry">重新连接</button></div>
<div class="empty" id="empty" hidden><div class="empty-icon" aria-hidden="true">♧</div><h3 id="empty-title"></h3><p id="empty-copy"></p></div>
<div id="pagination-top"></div>
<div id="list"></div>
<div id="pagination-bottom"></div>
</section>
<footer class="footer"><span>每 15 秒同步当前页 · 点击加载捕食回放</span><span>CORTICO · OBSERVATORY</span></footer>
<section class="feedback" aria-label="意见反馈"><button type="button" id="feedback-toggle" class="feedback-toggle" aria-expanded="false" aria-controls="feedback-panel">意见反馈</button><div id="feedback-panel" class="feedback-panel" hidden><form id="feedback-form"><label>反馈内容（最多 2000 字）<textarea id="feedback-text" name="text" maxlength="2000" rows="4"></textarea></label><label>联系方式（选填）<input id="feedback-contact" name="contact" maxlength="200" autocomplete="off"></label><p>仅服务端管理员可见。</p><button class="feedback-submit" id="feedback-submit" type="submit">提交反馈</button><p id="feedback-status" role="status"></p></form></div></section>
</main>
<script type="module">
import { createScene, createWaterScene, createPublicSelect, createPublicReplayControls } from './scene.js?v=dark-mode';
const $=id=>document.getElementById(id);
const sort=createPublicSelect($('sort'),'排列方式',()=>goPage(1));sort.setOptions([{value:'score',label:'按积分排序'},{value:'recent',label:'按上报时间排序'}]);
const scenes=new Map(),elementViews=new WeakMap();let kind='land',entries=[],loaded=false,requestVersion=0,loading=false,page=1,pages=1,total=0,counts={boxes:0,plants:0,animals:0},requestAbort,searchTimer;
const observer=typeof IntersectionObserver==='function'?new IntersectionObserver(changes=>{for(const change of changes){const view=elementViews.get(change.target);if(view){view.visible=change.isIntersecting;updateActivity(view)}}},{rootMargin:'100px'}):null;
const pagers=['pagination-top','pagination-bottom'].map(id=>{const nav=el('nav','pager'),previous=el('button','pager-button','上一页'),label=el('span','pager-label'),next=el('button','pager-button','下一页');nav.setAttribute('aria-label','生态箱分页');previous.type=next.type='button';previous.onclick=()=>goPage(page-1,true);next.onclick=()=>goPage(page+1,true);nav.append(previous,label,next);$(id).append(nav);return{nav,previous,label,next}});
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)'),animations=new Set();
function animate(node,frames,options){
 if(reducedMotion.matches)return;
 const animation=node.animate(frames,options);animations.add(animation);
 animation.onfinish=animation.oncancel=()=>animations.delete(animation);
}
reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches)for(const animation of animations)animation.cancel()});
function setCount(id,value){
 const node=$(id),text=String(value);if(node.textContent===text)return;
 node.textContent=text;animate(node,[{opacity:.35,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:350,easing:'ease-out'});
}
const dateFormat=new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
function el(tag,className,text){const node=document.createElement(tag);node.className=className;if(text!==undefined)node.textContent=text;return node}
function updateActivity(view){
 const active=view.visible&&!document.hidden;
 if(active&&view.entry){view.scene??=view.createScene(view.canvas);view.scene.setState({...view.entry.state,phase:view.entry.phase??'day'})}
 else{view.scene?.dispose();view.scene=null}
 view.replay?.setActive(active);
}
function removeView(view){observer?.unobserve(view.article);view.replayAbort?.abort();view.scene?.dispose();view.replay?.dispose();view.article.remove()}
function clearViews(){for(const view of scenes.values())removeView(view);scenes.clear()}
async function loadReplays(view){
 view.replayAbort?.abort();const abort=view.replayAbort=new AbortController();view.replayLoad.disabled=true;view.replayLoad.textContent='正在读取回放…';
 try{
  const {response,value:data}=await fetchJson('/api/boxes/'+encodeURIComponent(view.entry.id)+'?view=replays',abort.signal,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
  if(abort.signal.aborted||scenes.get(view.entry.id)!==view)return;
  view.replay?.dispose();view.replay=createPublicReplayControls(view.replayContainer,view.createScene);view.replay.setActive(view.visible&&!document.hidden);view.replay.setReplays(data.replays);
  view.replayLoad.textContent='刷新捕食回放';view.replayContainer.querySelector('.pc-disclosure').click();
 }catch(error){if(!abort.signal.aborted)view.replayLoad.textContent='回放读取失败，点击重试'}
 finally{if(!abort.signal.aborted)view.replayLoad.disabled=false}
}
function goPage(next,scroll=false){
 clearTimeout(searchTimer);requestVersion++;requestAbort?.abort();page=Math.max(1,next);entries=[];loaded=false;loading=false;clearViews();render();void load();
 if(scroll)$('gallery-title').scrollIntoView({behavior:reducedMotion.matches?'instant':'smooth',block:'start'});
}
function render(){
 const water=kind==='water';
 setCount('box-count',loaded?counts.boxes:'—');setCount('plant-count',loaded?counts.plants:'—');setCount('animal-count',loaded?counts.animals:'—');
 $('box-count-label').textContent=water?'水箱':'地箱';$('animal-count-label').textContent=water?'鱼':'虫子';
 const query=$('search').value.trim().toLocaleLowerCase();$('clear-search').hidden=!$('search').value;
 const rows=entries;
 $('status').textContent=loaded?(query?'找到 '+total+' 个生态箱':'共 '+counts.boxes+' 个'+(water?'水箱':'地箱')):'正在读取生态箱…';
 for(const pager of pagers){pager.nav.hidden=!loaded||pages<=1;pager.previous.disabled=loading||page<=1;pager.next.disabled=loading||page>=pages;pager.label.textContent='第 '+page+' / '+pages+' 页 · 每页 4 个'}
 const empty=loaded&&!rows.length;$('empty').hidden=!empty;
 if(empty){$('empty-title').textContent=query?'没有找到这个生态箱':water?'水域静候第一位住客':'这里还没有生态箱';$('empty-copy').textContent=query?'试试其他名称或 ID。':'认领并上报后，生态箱会出现在这里。'}
 const ids=new Set(rows.map(entry=>entry.id));
 for(const [id,view] of scenes)if(!ids.has(id)){removeView(view);scenes.delete(id)}
 rows.forEach((entry,index)=>{
  let view=scenes.get(entry.id);
  const isNew=!view;
  if(!view){
   const article=el('article','box'+(water?' water-box':'')),head=el('div','box-head'),rank=el('span','rank'),heading=el('div','heading'),title=el('h3',''),id=el('div','box-id','ID / '+entry.id),score=el('div','score'),points=el('strong',''),sceneWrap=el('div','scene-wrap'),canvas=document.createElement('canvas'),phase=el('span','phase'),metrics=el('div','box-metrics'),quality=el('div','quality'),replayContainer=el('div','replay-container'),replayLoad=el('button','replay-load'),foot=el('div','box-foot'),time=el('time','');
   canvas.width=800;canvas.height=500;canvas.setAttribute('role','img');score.append(points,el('span','','生态积分'));heading.append(title,id);head.append(rank,heading,score);sceneWrap.append(canvas,phase);foot.append(el('span','',water?'WATER / 水生生态':'LAND / 陆生生态'),time);article.append(head,sceneWrap,metrics,quality,replayLoad,replayContainer,foot);
   view={article,rank,title,points,canvas,phase,metrics,quality,time,replayContainer,replayLoad,createScene:water?createWaterScene:createScene,scene:null,replay:null,visible:!observer,entry};scenes.set(entry.id,view);elementViews.set(article,view);observer?.observe(article);replayLoad.type='button';replayLoad.onclick=()=>void loadReplays(view);
  }
  view.entry=entry;const state=entry.state,rank=entry.rank;view.article.dataset.rank=rank;view.rank.textContent=String(rank).padStart(2,'0');view.title.textContent=state.name??entry.id;view.points.textContent=Number(entry.score).toLocaleString('zh-CN',{maximumFractionDigits:1});view.canvas.setAttribute('aria-label',view.title.textContent+'的'+(water?'水箱':'地箱')+'场景');view.phase.textContent=entry.phase==='night'?'夜晚':'白天';
  const metrics=water?[['水生植物',state.plants.length],['鱼 / 鱼卵',state.fish.length+' / '+(state.eggs?.length??0)],['饲料',state.food.reduce((sum,food)=>sum+food.portions,0)]]:[['植物',state.plants.length],['虫子',state.bugs.length],['种子 / 虫卵',state.seeds.length+' / '+(state.eggs?.length??0)]];
  view.metrics.replaceChildren(...metrics.map(([label,value])=>{const node=el('div','metric',label);node.append(el('strong','',String(value)));return node}));view.quality.hidden=!water;
  if(!water){view.quality.hidden=!(state.nests?.length);view.quality.textContent=(state.nests??[]).map(nest=>'蚁巢 '+nest.depth+' 层 · 储粮 '+nest.food+'/'+(nest.depth*20)).join(' · ')}
  if(water)view.quality.replaceChildren(...[['含氧量',state.oxygen],['水质',state.cleanliness]].map(([label,value])=>{const node=el('span','',label);node.append(el('b','',value.toFixed(1)));return node}));
  view.time.dateTime=entry.reportedAt;view.time.textContent=dateFormat.format(new Date(entry.reportedAt))+' 上报';if($('list').children[index]!==view.article)$('list').insertBefore(view.article,$('list').children[index]??null);updateActivity(view);if(!view.replay){view.replayLoad.disabled=!entry.replayCount;view.replayLoad.textContent=entry.replayCount?'加载捕食回放（'+entry.replayCount+'）':'暂无捕食记录'}
  if(isNew)animate(view.article,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'translateY(0)'}],{duration:480,delay:Math.min(index,5)*65,easing:'cubic-bezier(.2,.7,.3,1)',fill:'backwards'});
 });
}
let publicAnnouncements=[];
async function loadAnnouncements(){
 try{
  const {response,value}=await fetchJson('/api/announcements/public?view=latest',undefined,{timeoutMs:10000,cache:'no-store'});if(!response.ok)return;
  const {announcements:next}=value;if(JSON.stringify(next)===JSON.stringify(publicAnnouncements))return;
  const oldIds=new Set(publicAnnouncements.map(notice=>notice.id));publicAnnouncements=next;const root=$('announcements');root.hidden=!next.length;
  root.replaceChildren(...[...next].reverse().map(notice=>{const article=el('article','announcement'),title=el('h3','',notice.title||'服务端公告'),text=el('p','',notice.text),time=el('time','',dateFormat.format(new Date(notice.createdAt)));time.dateTime=notice.createdAt;article.append(title,text,time);if(!oldIds.has(notice.id))animate(article,[{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'translateY(0)'}],{duration:320,easing:'ease-out'});return article}));
 }catch{}
}
async function load(){
 if(document.hidden)return;
 requestAbort?.abort();const abort=requestAbort=new AbortController(),version=++requestVersion,requestedKind=kind;loading=true;for(const pager of pagers){pager.previous.disabled=pager.next.disabled=true;}
 try{
  const query=new URLSearchParams({kind:requestedKind,view:'gallery',page:String(page),pageSize:'4',sort:sort.value,q:$('search').value.trim()});
  const {response,value:rows}=await fetchJson('/api/leaderboard?'+query,abort.signal,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);
  if(version!==requestVersion)return;
  entries=rows.entries;page=rows.page;pages=rows.pages;total=rows.total;counts=rows.counts;loaded=true;$('error').hidden=true;$('connection').dataset.state='online';$('connection-label').textContent='同步中 · 每 15 秒';render();
 }catch(error){if(version!==requestVersion||abort.signal.aborted)return;$('error').hidden=false;$('error').querySelector('span').textContent=loaded?'连接中断，保留上次同步的状态。':'暂时无法读取生态箱。';$('connection').dataset.state='error';$('connection-label').textContent='连接中断';if(!loaded)$('status').textContent='等待重新连接';}
 finally{if(version===requestVersion){loading=false;render()}}
}
document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{if(kind===button.dataset.kind)return;kind=button.dataset.kind;document.querySelectorAll('.tab').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));$('error').hidden=true;goPage(1)}));
$('search').addEventListener('input',()=>{requestVersion++;requestAbort?.abort();loading=true;clearTimeout(searchTimer);searchTimer=setTimeout(()=>goPage(1),250)});$('clear-search').addEventListener('click',()=>{$('search').value='';$('search').focus();goPage(1)});$('retry').addEventListener('click',()=>void load());
const announcementTimer=setInterval(()=>{if(!document.hidden)void loadAnnouncements()},30000),pollTimer=setInterval(()=>{if(!loading&&!document.hidden)void load()},15000);
document.addEventListener('visibilitychange',()=>{for(const view of scenes.values())updateActivity(view);if(document.hidden){requestVersion++;requestAbort?.abort();loading=false;for(const animation of animations)animation.cancel()}else{void load();void loadAnnouncements()}});
let coinsOpen=false,coinsLoading=false;
$('coins-toggle').addEventListener('click',async()=>{
 coinsOpen=!coinsOpen;$('coins-toggle').setAttribute('aria-expanded',String(coinsOpen));$('coins-board').hidden=!coinsOpen;
 if(!coinsOpen||coinsLoading)return;coinsLoading=true;
 const board=$('coins-board');board.replaceChildren(el('p','','正在翻阅商人的账簿…'));
 try{
  const {response,value:data}=await fetchJson('/api/leaderboard?kind=land&view=coins&limit=20',undefined,{cache:'no-store'});
  if(!response.ok||data.metric!=='coins'||!Array.isArray(data.entries))throw Error('暂时无法读取金币榜');
  board.replaceChildren(el('p','','按上次提交的金币余额排名；购买花盆会降低余额。与生态积分分开计算。'));
  const list=el('ol','');
  for(const row of data.entries){const item=el('li','');item.append(el('strong','',row.name||'未命名生态箱'),document.createTextNode(` · ${row.coins} 金币 · 累计收入 ${row.earned}`));list.append(item)}
  board.append(data.entries.length?list:el('p','','商人还没收到第一株植物。'));
  if(coinsOpen)animate(board,[{transform:'translateY(-8px)'},{transform:'translateY(0)'}],{duration:220,easing:'ease-out'});
 }catch(error){board.replaceChildren(el('p','','暂时无法读取金币榜，收起后可重试。'))}
 finally{coinsLoading=false}
});
void loadAnnouncements();void load();
window.addEventListener('pagehide',event=>{if(event.persisted)return;requestVersion++;requestAbort?.abort();clearTimeout(searchTimer);clearInterval(announcementTimer);clearInterval(pollTimer);observer?.disconnect();sort.dispose();clearViews();for(const animation of animations)animation.cancel()});
</script>
<script type="module">
const feedbackToggle=document.getElementById('feedback-toggle'),feedbackPanel=document.getElementById('feedback-panel'),feedbackText=document.getElementById('feedback-text'),feedbackContact=document.getElementById('feedback-contact'),feedbackStatus=document.getElementById('feedback-status'),feedbackSubmit=document.getElementById('feedback-submit');
feedbackToggle.addEventListener('click',()=>{feedbackPanel.hidden=!feedbackPanel.hidden;feedbackToggle.setAttribute('aria-expanded',String(!feedbackPanel.hidden));if(!feedbackPanel.hidden)feedbackText.focus()});
feedbackPanel.addEventListener('keydown',event=>{if(event.key==='Escape'){feedbackPanel.hidden=true;feedbackToggle.setAttribute('aria-expanded','false');feedbackToggle.focus()}});
let feedbackPending=false;
document.getElementById('feedback-form').addEventListener('submit',async event=>{event.preventDefault();if(feedbackPending)return;const text=feedbackText.value.trim(),contact=feedbackContact.value.trim();if(!text||text.length>2000){feedbackStatus.textContent='请填写 1–2000 字的反馈内容';feedbackText.focus();return}feedbackPending=true;feedbackSubmit.disabled=true;feedbackText.disabled=true;feedbackContact.disabled=true;feedbackStatus.textContent='提交中…';try{const {response,value:receipt}=await fetchJson('/api/feedback',undefined,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,contact,source:'web'}),timeoutMs:10000});if(!response.ok)throw new Error(response.status===429?'提交过于频繁，请一分钟后重试':response.status===404||response.status===405?'服务端暂不支持反馈':response.status===503?'反馈收件箱已满，请稍后再试':`提交失败（${response.status}）`);if(!Number.isSafeInteger(receipt.id)||receipt.id<1)throw new Error('服务端回执格式不兼容');feedbackStatus.textContent=`已提交，编号 #${receipt.id}`;feedbackText.value='';feedbackContact.value=''}catch(error){feedbackStatus.textContent=error instanceof Error?error.message:'提交失败，请稍后重试'}finally{feedbackPending=false;feedbackSubmit.disabled=false;feedbackText.disabled=false;feedbackContact.disabled=false}});
</script>
<script>
(async()=>{let version=document.querySelector('.release-art')?.dataset.version;async function update(){try{const r=await fetch('/api/presentation');if(!r.ok)return;const p=await r.json();if(p.logoVersion!==version&&typeof p.logo==='string'){const art=document.querySelector('.release-art');if(art){art.innerHTML=p.logo;art.dataset.version=p.logoVersion;version=p.logoVersion}}}catch{}}await update();setInterval(()=>{if(!document.hidden)update()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()})})();
</script></body>
</html>
